name: llm-injection-firewall
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Runtime and tests are stdlib-only; scikit-learn is needed only to retrain (train.py).
      - run: python -m unittest -v
